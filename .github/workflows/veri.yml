name: Veriyi guncelle

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy pandas scipy
      - run: python indir.py
      - run: python kaydet.py
      - name: Kaydet
        run: |
          git config user.name "veri-botu"
          git config user.email "veri-botu@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Veri guncellendi $(date -u +%Y-%m-%dT%H:%M)"
          git push
